server {
    listen 80;
    server_name aspa.moonfair.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/asp-lineup-hub/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://aspa.moonfair.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aspa.moonfair.cn;

    ssl_certificate /etc/letsencrypt/live/aspa.moonfair.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aspa.moonfair.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 350k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;

    location = /api/desktop/feedback {
        client_max_body_size 9m;
        proxy_read_timeout 125s;
        proxy_pass http://127.0.0.1:4173;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
    }
}
